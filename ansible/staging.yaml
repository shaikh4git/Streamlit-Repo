
---
- name: Deploy Streamlit on Docker Desktop
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: "{{ playbook_dir }}/.venv/bin/python"
    image_repo: "shaikhdocker/sshuda-streamlit-app"
    image_tag: "54-74c6783"
    container_name: "streamlit-staging"
    staging_port: 8502

  tasks:
    - name: Pull and run Streamlit container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_repo }}:{{ image_tag }}"
        state: started
        pull: always
        recreate: true
        restart_policy: unless-stopped
        published_ports:
          - "127.0.0.1:{{ staging_port }}:8501"

    - name: Verify Streamlit health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ staging_port }}/_stcore/health"
        method: GET
        status_code: 200
      register: health
      until: health.status == 200
      retries: 15
      delay: 2

    - name: Display deployment result
      ansible.builtin.debug:
        msg: "Streamlit staging is healthy"
